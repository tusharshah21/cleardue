# Render Blueprint. The database is Neon (external), so DATABASE_URL is set by hand in the dashboard.
services:
  - type: web
    name: cleardue
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      # The hosted demo makes live AI calls; DEMO_MODE replay is for recording the video locally.
      - key: DEMO_MODE
        value: "false"
      # The final deploy uses the sandbox. Mock mode is refused in production unless ALLOW_MOCK_IN_PROD=true
      # (set both in the dashboard for an early deploy check).
      - key: PAYPAL_MODE
        value: "sandbox"
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Judges share the demo login: the sync cron resets the three demo stories daily at 03:00 UTC.
      - key: DEMO_DAILY_RESET
        value: "true"
      - key: SESSION_PASSWORD
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
  # Polling fallback: re-syncs open invoices every 5 minutes (webhooks can be late or missing).
  - type: cron
    name: cleardue-sync
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/sync"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: cleardue
          envVarKey: CRON_SECRET
      - key: APP_URL
        fromService:
          type: web
          name: cleardue
          envVarKey: APP_URL