# Render Blueprint. The database is Neon (external), so DATABASE_URL is set by hand in the dashboard.
services:
  - type: web
    name: cleardue
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Gemini through Google AI Studio's free tier. Set AI_PROVIDER=anthropic (and ANTHROPIC_API_KEY) to use Claude instead.
      - key: AI_PROVIDER
        value: google
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      # The hosted demo makes live AI calls; DEMO_MODE replay is for recording the video locally.
      - key: DEMO_MODE
        value: "false"
      # The final deploy uses the sandbox. Mock mode is refused in production unless ALLOW_MOCK_IN_PROD=true
      # (set both in the dashboard for an early deploy check).
      - key: PAYPAL_MODE
        value: "sandbox"
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Judges share the demo login: the sync cron resets the three demo stories daily at 03:00 UTC.
      - key: DEMO_DAILY_RESET
        value: "true"
      - key: SESSION_PASSWORD
        generateValue: true
      # The public URL is RENDER_EXTERNAL_URL, which Render sets itself; APP_URL is only an optional override
      # (for a custom domain), so a fresh blueprint apply needs no variable to exist first.
      - key: CRON_SECRET
        generateValue: true
  # Polling fallback: re-syncs open invoices every 5 minutes (webhooks can be late or missing).
  - type: cron
    name: cleardue-sync
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: "true"
    # Calls the web service over Render's private network (WEB_HOSTPORT is "cleardue:10000"), so it needs no public URL.
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "http://$WEB_HOSTPORT/api/sync"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: cleardue
          envVarKey: CRON_SECRET
      - key: WEB_HOSTPORT
        fromService:
          type: web
          name: cleardue
          property: hostport